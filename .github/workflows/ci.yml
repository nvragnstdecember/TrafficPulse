name: CI

# Two quality gates, one per half of the product.
#
# `quality` is the backend gate that has existed since the Phase 0-F baseline:
# one OS, one Python version, three checks (ruff, mypy, pytest). No matrix, GPU,
# Docker, dataset, model-download, or deployment jobs (see docs/phase-0-plan.md, U1).
#
# `frontend` was added in H13. Until then CI ran only the backend, so roughly 16k
# lines of TypeScript -- the entire analyst-facing product -- could be broken by a
# merged PR with no signal at all. "CI is green" now means both halves are green.
#
# The jobs are deliberately independent: the frontend depends on the API's JSON
# contract, not on its Python, so there is nothing to share and a backend failure
# should not mask a frontend one (or vice versa).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and development tooling
        run: |
          python -m pip install --upgrade pip
          # `api` (fastapi, python-multipart) is required alongside `dev`: mypy
          # type-checks src/trafficpulse/app (H7A) and pytest collects tests/app,
          # both of which import fastapi directly (see pyproject.toml, `api`).
          #
          # `overlay` (pillow) is required for the same reason one level down:
          # mypy type-checks src/trafficpulse/overlay/renderer.py, which imports
          # PIL. Pillow ships `py.typed`, so installing it means the renderer is
          # checked against real types instead of being silenced to Any -- and it
          # un-skips tests/overlay/test_overlay_{renderer,video}.py, which
          # `pytest.importorskip("PIL")` otherwise skips entirely in CI.
          #
          # `rtdetr` is deliberately NOT installed: torch/transformers are lazily
          # imported ML backends, CI stays ML-free, and their untyped calls are
          # handled by the mypy overrides in pyproject.toml.
          python -m pip install -e ".[dev,api,overlay]"

      - name: Ruff (lint)
        run: ruff check .

      - name: mypy (static type check)
        run: mypy src

      - name: pytest (tests)
        run: pytest -q

  frontend:
    name: Frontend (lint, typecheck, vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # The lockfile is the cache key, so a dependency change invalidates it.
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # `npm ci` rather than `npm install`: it installs exactly the lockfile and
        # fails if package.json and the lock have drifted, which is what makes the
        # gate reproducible.
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript (project references, no emit)
        run: npm run typecheck

      - name: Vitest
        run: npm test -- --run
