name: CI

# Single-environment Linux quality gate for the Phase 0-F repository baseline.
# Deliberately minimal: one OS, one Python version, three checks
# (ruff, mypy, pytest). No matrix, GPU, Docker, dataset, model-download,
# or deployment jobs (see docs/phase-0-plan.md, U1).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and development tooling
        run: |
          python -m pip install --upgrade pip
          # `api` (fastapi, python-multipart) is required alongside `dev`: mypy
          # type-checks src/trafficpulse/app (H7A) and pytest collects tests/app,
          # both of which import fastapi directly (see pyproject.toml, `api`).
          #
          # `overlay` (pillow) is required for the same reason one level down:
          # mypy type-checks src/trafficpulse/overlay/renderer.py, which imports
          # PIL. Pillow ships `py.typed`, so installing it means the renderer is
          # checked against real types instead of being silenced to Any -- and it
          # un-skips tests/overlay/test_overlay_{renderer,video}.py, which
          # `pytest.importorskip("PIL")` otherwise skips entirely in CI.
          #
          # `rtdetr` is deliberately NOT installed: torch/transformers are lazily
          # imported ML backends, CI stays ML-free, and their untyped calls are
          # handled by the mypy overrides in pyproject.toml.
          python -m pip install -e ".[dev,api,overlay]"

      - name: Ruff (lint)
        run: ruff check .

      - name: mypy (static type check)
        run: mypy src

      - name: pytest (tests)
        run: pytest -q
