# HELMET (Myanmar) — candidate for helmet-state and rider-count pretraining.
identity:
  id: helmet-myanmar
  name: HELMET dataset (Siebert & Lin)
  release: "HELMET (~2020)"
  task_categories: [helmet_classification, rider_count, detection]
  domain_context: Motorcycle helmet use across observation sites in Myanmar (~91k frames, ~10k motorcycles).
  intended_use: >
    Pretraining/augmentation for helmet-state classification and rider-count
    estimation; derived head/bike crops feed the CNN-vs-ViT helmet experiment.
  registry_status: approved_for_acquisition

provenance:
  canonical_source_name: HELMET dataset (OSF)
  canonical_source_url: https://osf.io/4pwj8/
  publisher: Siebert & Lin (associated IEEE Access publication)
  source_type: academic_dataset
  citation: "Siebert & Lin, Helmet Use Detection of Tracked Motorcycles using CNN-based Multi-task Learning; see also arXiv:1910.13232"
  date_last_verified: "2026-08-29"

access:
  status: public_direct
  procedure: >
    Public OSF node (osf.io/4pwj8), downloadable directly over HTTPS with no
    account, registration, or data-use agreement. Files are addressed by stable
    OSF GUIDs (Readme.txt=pvecy, data_split.csv=q7rmb, annotation.zip=buh57,
    image/part_1..part_7.zip under folder 5e68b6a10cd06c008f000c45).
  registration_required: not_required
  application_required: not_required
  access_confirmed_by_project: true
  notes: >
    Confirmed 2026-08-29 against the OSF API (GET /v2/nodes/4pwj8/): the node is
    public and its osfstorage listing is readable unauthenticated. This SUPERSEDES
    the 2026-07-07 "unconfirmed" record, which was caused by the JS-rendered OSF
    web page rather than by any actual access restriction; the JSON:API endpoint
    returns the same metadata without a browser. Contents verified: annotation.zip
    (3,012,229 B), data_split.csv (21,336 B — the authors' official
    training/validation/test assignment over 910 video_ids), Readme.txt (791 B),
    F-measure.zip (1,014,623 B), and image/ as seven zip parts totalling
    28,860,986,216 B.

licensing:
  status: verified
  identifier: CC-BY-4.0
  source: https://api.osf.io/v2/nodes/4pwj8/?embed=license
  commercial_use: allowed
  redistribution: allowed
  notes: >
    Verified 2026-08-29 from the OSF node's own licence relationship: licence
    object 563c1cf88c5e4a3877f9e96a, "CC-By Attribution 4.0 International",
    node_license.year 2020. This resolves the 2026-07-07 "unknown" record (the
    licence field could not be read from the JS-rendered page) and agrees with the
    independent H1 verification recorded in experiments/helmet_rtdetr/registry.py,
    which cited the same licence object. ATTRIBUTION IS MANDATORY: any published
    artifact derived from this dataset must credit Siebert, F.W. & Lin, H., HELMET
    dataset (OSF, https://osf.io/4pwj8/), CC-BY 4.0. Redistribution is permitted
    under the same terms, but TrafficPulse still vendors nothing — see integrity.

task_fit:
  trafficpulse_capabilities: [helmet_classification, rider_count]
  ontology_references:
    helmet_states: [helmet, no_helmet, uncertain]
    violation_types: [no_helmet, triple_riding]
    observation_types: [helmet_state, rider_count]
  annotation_types: [motorcycle_tracks, rider_helmet_labels]
  strengths: In-purpose helmet + rider-count video labels for pretraining and augmentation.
  domain_gaps: >
    Myanmar (not Indian) road/appearance domain, recorded 2016, daytime only.
    Turban headwear is not a native label and neither is an uncertain/occluded
    state — Indian-context turban crops require custom annotation (ontology U3),
    so any experiment on this corpus alone is binary helmet/no_helmet.
  suitability: partially_suitable
  custom_data_still_required: required

split_leakage:
  source_grouping_unit: observation_site_and_video
  camera_identity: available
  video_identity: available
  sequence_identity: available
  official_split_available: available
  preserve_official_split: preserve
  leakage_risks: >
    Adjacent frames of a tracked motorcycle are highly correlated; crops must
    inherit their source video's split and no track may span splits. The authors'
    data_split.csv is video-level (636 training / 92 validation / 182 test over
    910 clips) and is preserved verbatim. NOTE: the twelve observation sites are
    SHARED across the three official splits, so the official split measures
    video-level, not site-level, generalisation; a whole-site holdout would have
    to discard the official assignment and is therefore reported as per-site test
    slices instead.

privacy_ethics:
  faces_present: likely
  plates_present: likely
  pii_concerns: Riders' faces and plates are likely visible.
  handling_notes: >
    Apply redaction expectations; treat derived crops under the same split policy.
    Derived crops are working artifacts only: neither the source frames nor the
    crops are committed to this repository or shipped in any release.

integrity:
  checksum_status: recorded
  local_acquisition_status: downloaded_unverified
  acquisition_date: "2026-08-29"
  immutable_source_reference: >
    OSF node 4pwj8, osfstorage. Files addressed by their stable OSF GUIDs:
    Readme.txt=pvecy, data_split.csv=q7rmb, annotation.zip=buh57,
    image/part_1..7.zip = 452nq, muzgb, 9dmw3, 39ynb, v3rch, jyg9s, 6h5ka.
